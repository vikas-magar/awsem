[package]
name = "awsem-care"
version = "0.1.0"
edition = "2024"

[lib]
name = "awsem_care"

[dependencies]
actix-web = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
awsem-core = { path = "../awsem-core" }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
bytes = "1"
tokio = { version = "1", features = ["full"] }
